[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinli-crypto"
version = "0.1.0"
description = "Tinli crypto digital fair value: Kalshi BTC/ETH binaries priced off the Deribit option chain"
requires-python = ">=3.12"
dependencies = ["tinli-schema", "tinli-divergence"]

[tool.hatch.build.targets.wheel]
packages = ["tinli_crypto"]
